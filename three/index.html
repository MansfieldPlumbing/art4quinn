<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>flickpaint3d — art4quinn</title>
<style>
  :root{
    --bg:#0d0d12; --panel:rgba(26,26,32,0.82); --border:#33333f;
    --text:#e8e8ee; --dim:#9a9aa8; --accent:#6a4bff; --brand:#39ff14;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden;}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #1b1b2a 0%, #0d0d12 55%, #08080c 100%);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #viewport{position:fixed; inset:0; touch-action:none;}
  canvas{display:block;}

  header{
    position:fixed; top:0; left:0; right:0; height:54px; z-index:20;
    display:flex; align-items:center; justify-content:space-between; padding:0 14px;
    background:linear-gradient(rgba(13,13,18,0.9), rgba(13,13,18,0));
  }
  .brand{font-weight:800; font-size:1.15rem; letter-spacing:.5px; color:var(--brand);}
  .brand b{color:var(--accent); font-weight:800;}
  .brand small{color:var(--dim); font-weight:600; font-size:.7rem; letter-spacing:1px; margin-left:6px;}
  .top-actions{display:flex; gap:8px;}

  button{font-family:inherit; cursor:pointer;}
  .btn{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:8px 12px; border-radius:11px; font-size:.82rem; font-weight:600;
    backdrop-filter:blur(8px); display:flex; align-items:center; gap:6px;
  }
  .btn:active{transform:scale(.96);}
  .btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  a.btn{text-decoration:none;}

  #tools{
    position:fixed; top:62px; right:12px; z-index:20; width:210px;
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:12px; backdrop-filter:blur(12px); display:flex; flex-direction:column; gap:12px;
  }
  .row{display:flex; gap:8px;}
  .row .btn{flex:1; justify-content:center;}
  label.fld{display:block; font-size:.72rem; color:var(--dim); font-weight:700; letter-spacing:.4px; margin-bottom:5px; text-transform:uppercase;}
  .fld span{color:var(--text); float:right;}
  input[type=range]{width:100%; accent-color:var(--accent); margin:0;}
  .swatches{display:grid; grid-template-columns:repeat(6,1fr); gap:6px;}
  .swatch{width:100%; aspect-ratio:1; border-radius:8px; border:2px solid rgba(255,255,255,.12); padding:0;}
  .swatch:active{transform:scale(.9);}
  .swatch.active{border-color:var(--brand); box-shadow:0 0 0 2px var(--brand);}
  #color{width:100%; height:34px; border:1px solid var(--border); border-radius:9px; background:none; padding:2px;}

  #tray{
    position:fixed; left:0; right:0; bottom:0; z-index:20; height:118px;
    display:flex; gap:10px; overflow-x:auto; padding:12px 14px;
    background:linear-gradient(rgba(13,13,18,0), rgba(13,13,18,0.92));
    scrollbar-width:thin;
  }
  .char{
    flex:0 0 auto; width:84px; height:94px; border-radius:12px; padding:0; overflow:hidden;
    background:#16161e; border:2px solid var(--border); position:relative;
    display:flex; flex-direction:column; align-items:center;
  }
  .char img{width:100%; height:70px; object-fit:contain; background:#1f1f29; pointer-events:none;}
  .char span{font-size:.62rem; color:var(--dim); line-height:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; padding:0 4px;}
  .char.active{border-color:var(--brand);}
  .char.active span{color:var(--brand);}

  #status{
    position:fixed; left:50%; top:60px; transform:translateX(-50%); z-index:15;
    font-size:.78rem; color:var(--dim); background:rgba(13,13,18,.6);
    padding:5px 12px; border-radius:20px; backdrop-filter:blur(6px); max-width:70vw;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;
  }

  #toolsToggle{display:none;}
  @media (max-width:560px),(orientation:portrait){
    #tools{top:auto; bottom:128px; right:8px; left:8px; width:auto; max-height:46vh; overflow-y:auto; flex-direction:row; flex-wrap:wrap; align-items:flex-start;}
    #tools .grp{flex:1 1 46%;}
    #tools.tools-hidden{display:none;}
    #toolsToggle{display:flex;}
    #status{top:54px;}
  }
</style>
</head>
<body>

<div id="viewport"></div>

<header>
  <div class="brand">flick<b>paint</b>3d <small>ART4QUINN</small></div>
  <div class="top-actions">
    <a class="btn" href="../" title="Home">← Home</a>
    <button class="btn" id="toolsToggle" title="Show / hide tools">🎛️</button>
    <button class="btn" id="shot" title="Save a picture of the scene">📷</button>
    <button class="btn" id="save" title="Save the painted skin">💾</button>
  </div>
</header>

<div id="status">pick a character below</div>

<div id="tools">
  <div class="grp">
    <div class="row">
      <button class="btn active" id="brush">🖌 Brush</button>
      <button class="btn" id="eraser">🧽 Erase</button>
    </div>
  </div>
  <div class="grp">
    <label class="fld">Color</label>
    <div class="swatches">
      <button class="swatch" style="background:#39ff14" data-c="#39ff14"></button>
      <button class="swatch" style="background:#ff3b5c" data-c="#ff3b5c"></button>
      <button class="swatch" style="background:#ffd23b" data-c="#ffd23b"></button>
      <button class="swatch" style="background:#3bc9ff" data-c="#3bc9ff"></button>
      <button class="swatch" style="background:#b06bff" data-c="#b06bff"></button>
      <button class="swatch" style="background:#ffffff" data-c="#ffffff"></button>
      <button class="swatch" style="background:#ff8a3b" data-c="#ff8a3b"></button>
      <button class="swatch" style="background:#1bd49a" data-c="#1bd49a"></button>
      <button class="swatch" style="background:#ff5edb" data-c="#ff5edb"></button>
      <button class="swatch" style="background:#7a7a88" data-c="#7a7a88"></button>
      <button class="swatch" style="background:#2b2b36" data-c="#2b2b36"></button>
      <button class="swatch" style="background:#000000" data-c="#000000"></button>
    </div>
    <input type="color" id="color" value="#39ff14">
  </div>
  <div class="grp">
    <label class="fld">Brush <span id="sizeVal">26</span></label>
    <input type="range" id="size" min="4" max="120" value="26">
  </div>
  <div class="grp">
    <label class="fld">Opacity <span id="opacityVal">90%</span></label>
    <input type="range" id="opacity" min="5" max="100" value="90">
  </div>
  <div class="row">
    <button class="btn" id="clear">Clear paint</button>
    <button class="btn" id="reset">Recenter</button>
  </div>
  <div class="grp">
    <label class="fld">View</label>
    <div class="row">
      <button class="btn" data-view="front">Front</button>
      <button class="btn" data-view="34">¾</button>
      <button class="btn" data-view="side">Side</button>
    </div>
    <div class="row">
      <button class="btn" data-view="back">Back</button>
      <button class="btn" data-view="top">Top</button>
    </div>
  </div>
  <div class="grp">
    <label class="fld">Floor <span id="measure"></span></label>
    <input type="range" id="ynudge" min="-1" max="1" step="0.01" value="0">
    <div class="row">
      <button class="btn" id="snap">Snap to floor</button>
      <button class="btn" id="showbox">Show box</button>
    </div>
  </div>
</div>

<div id="tray"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
