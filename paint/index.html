<title>FlickPaint</title>

<!--
  FlickPaint — single-file vanilla applet (the 2D paint app; living reference for a true flickpaint3d).
  Truth is NOT held in this page. All live state flows through the Sys facade
  (Sys.registry = Cm-shaped contract/catalog, Sys.vom = Vom-shaped object store).
  Standalone (github.io / file://) binds an EmbeddedProvider; a subsystem host
  that injects window.__SUBSYSTEM_PROVIDER__ (or chrome.webview) takes over with
  ZERO UI changes — that is the .obp mode. See #obp-manifest below.
-->
<script type="application/json" id="obp-manifest">
{
  "obp": 1,
  "type": "Applet",
  "name": "FlickPaint",
  "title": "FlickPaint",
  "mount": "\\Applets\\FlickPaint",
  "entry": "index.html",
  "provider": { "contract": "1.0", "inject": "window.__SUBSYSTEM_PROVIDER__" },
  "requires": {
    "registry": ["Resolve", "Set", "Enumerate"],
    "vom": ["Register", "Open", "Query", "Set", "Enumerate", "Unregister", "Wait", "Signal"]
  },
  "projects": {
    "\\Document": "the live painting document (canvas dims, layers, selection)",
    "\\Session": "session settings (tool, color, brush size/opacity, view)",
    "\\Catalog": "read-only contract: tools, brushes, swatches, blend modes"
  }
}
</script>

<script type="module">
/* ============================================================================
 *  SYS FACADE — the only source of truth.  registry (Cm) + vom (Vom).
 *  bootProvider() binds a host-injected provider (.obp mode) or the embedded
 *  shim (standalone / github.io).  The UI never owns state — it asks Sys.
 * ========================================================================== */

const P = {
  doc:       '\\Document',
  layers:    '\\Document\\Layers',
  selection: '\\Document\\Selection',
  session:   '\\Session',
  catalog:   '\\Catalog',
};
const layerPath = (id) => `\\Document\\Layers\\${id}`;

function createEmbeddedVom() {
  const objects = new Map();   // path -> { path, type, values }
  const subs = new Map();      // path -> Set<cb>
  const emitUp = (path) => {
    let p = path;
    for (;;) {
      const s = subs.get(p); if (s) s.forEach((cb) => cb(path));
      const i = p.lastIndexOf('\\');
      if (i <= 0) break;
      p = p.slice(0, i);
    }
    const star = subs.get('*'); if (star) star.forEach((cb) => cb(path));
  };
  return {
    Register(path, type = 'Object', values = {}) {
      let o = objects.get(path);
      if (!o) { o = { path, type, values: { ...values } }; objects.set(path, o); }
      else { Object.assign(o.values, values); }
      emitUp(path); return o;
    },
    Open(path) { return objects.get(path) || null; },
    Query(path) { const o = objects.get(path); return o ? o.values : null; },
    Set(path, key, value) {
      let o = objects.get(path);
      if (!o) { o = { path, type: 'Object', values: {} }; objects.set(path, o); }
      o.values[key] = value; emitUp(path);
    },
    Merge(path, patch) {
      let o = objects.get(path);
      if (!o) { o = { path, type: 'Object', values: {} }; objects.set(path, o); }
      Object.assign(o.values, patch); emitUp(path);
    },
    Enumerate(prefix) {
      const pre = prefix.endsWith('\\') ? prefix : prefix + '\\';
      const seen = new Set(); const out = [];
      for (const k of objects.keys()) {
        if (k.startsWith(pre) && k !== prefix) {
          const first = k.slice(pre.length).split('\\')[0];
          if (first && !seen.has(first)) { seen.add(first); out.push(pre + first); }
        }
      }
      return out;
    },
    Unregister(path) {
      for (const k of [...objects.keys()]) {
        if (k === path || k.startsWith(path + '\\')) objects.delete(k);
      }
      emitUp(path);
    },
    Wait(path, cb) {
      if (!subs.has(path)) subs.set(path, new Set());
      subs.get(path).add(cb);
      return () => subs.get(path) && subs.get(path).delete(cb);
    },
    Signal(path) { emitUp(path); },
    _dump() { return [...objects.keys()].sort(); },
  };
}

function createEmbeddedRegistry(seed) {
  const data = { ...seed };
  return {
    Resolve(path) { return data[path]; },
    Set(path, val) { data[path] = val; },
    Enumerate(path) {
      const pre = path.endsWith('\\') ? path : path + '\\';
      const seen = new Set();
      for (const k of Object.keys(data)) {
        if (k.startsWith(pre)) { const first = k.slice(pre.length).split('\\')[0]; if (first) seen.add(pre + first); }
      }
      return [...seen];
    },
  };
}

    { value: 'Dodge', name: 'Color Dodge', description: 'Vivid highlight saturation' },
    { value: 'Burn', name: 'Color Burn', description: 'Rich, burned shadows' },
  ],

function bootProvider() {
  const injected = window.__SUBSYSTEM_PROVIDER__;
  if (injected && injected.vom && injected.registry) {
    return { mode: 'obp', ...injected };
  }
  // chrome.webview present but no object injected: we still run embedded, but flag it
  const host = !!(window.chrome && window.chrome.webview);
  return {
    mode: host ? 'obp-pending' : 'standalone',
    vom: createEmbeddedVom(),
    registry: createEmbeddedRegistry(CATALOG),
  };
}

const Sys = bootProvider();

/* convenience accessors */
const session = (k) => { const v = Sys.vom.Query(P.session); return v ? v[k] : undefined; };
const setSession = (k, v) => Sys.vom.Set(P.session, k, v);
const getOrder = () => (Sys.vom.Query(P.layers) || {}).order || [];
const setOrder = (arr) => Sys.vom.Set(P.layers, 'order', arr);
const getLayer = (id) => Sys.vom.Query(layerPath(id));
const setLayer = (id, patch) => Sys.vom.Merge(layerPath(id), patch);
const getLayers = () => getOrder().map((id) => getLayer(id)).filter(Boolean);
const doc = (k) => { const v = Sys.vom.Query(P.doc); return v ? v[k] : undefined; };

/* tiny reactive helper: run render now and whenever path (or descendants) change */
function bind(path, render) { render(); return Sys.vom.Wait(path, render); }

function paintIcons(root = document) {

    if (e.dataset.painted) return;
    e.innerHTML = iconHTML(e.dataset.icon); e.dataset.painted = '1';
  });
}

      c.ctx.putImageData(img, x, y);
    },
    onPointerUp() { buf = null; } });
})();

reg({ id: 'text', name: 'Text', type: 'vector', cursor: 'text',
  onPointerDown(pt, c) { const t = prompt('Enter text to draw:'); if (!t || !t.trim()) return; c.pushUndoState(); const g = c.ctx; g.save(); const sz = Math.max(10, c.size * 1.5); g.font = `600 ${sz}px "Selawik", system-ui, sans-serif`; g.fillStyle = c.color; g.globalAlpha = c.opacity / 100; g.textBaseline = 'middle'; g.fillText(t, pt.x, pt.y); g.restore(); },
  onPointerMove() {}, onPointerUp() {} });

const shapeTool = (id, name, draw) => {
  let startPt = null, snap = null;
  reg({ id, name, type: 'vector', cursor: 'crosshair',
    onPointerDown(pt, c) { c.pushUndoState(); startPt = pt; snap = document.createElement('canvas'); snap.width = c.canvas.width; snap.height = c.canvas.height; snap.getContext('2d').drawImage(c.canvas, 0, 0); },
    onPointerMove(pt, c) { if (!startPt || !snap) return; const g = c.ctx; g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.canvas.width, c.canvas.height); g.drawImage(snap, 0, 0); g.restore(); g.globalCompositeOperation = 'source-over'; g.globalAlpha = c.opacity / 100; g.fillStyle = c.color; draw(g, startPt, pt); g.globalAlpha = 1; },
    onPointerUp() { startPt = null; snap = null; } });
};
shapeTool('rect', 'Rectangle', (g, s, p) => { g.fillRect(Math.min(s.x, p.x), Math.min(s.y, p.y), Math.abs(s.x - p.x), Math.abs(s.y - p.y)); });
shapeTool('ellipse', 'Ellipse', (g, s, p) => { const x = Math.min(s.x, p.x), y = Math.min(s.y, p.y), w = Math.abs(s.x - p.x), h = Math.abs(s.y - p.y); g.beginPath(); g.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 2 * Math.PI); g.fill(); });
shapeTool('poly', 'Polygon', (g, s, p) => { const dx = p.x - s.x, dy = p.y - s.y, r = Math.hypot(dx, dy); if (r < 1) return; const a0 = Math.atan2(dy, dx); g.beginPath(); for (let i = 0; i < 3; i++) { const a = a0 + i * 2 * Math.PI / 3; const vx = s.x + r * Math.cos(a), vy = s.y + r * Math.sin(a); i ? g.lineTo(vx, vy) : g.moveTo(vx, vy); } g.closePath(); g.fill(); });

const setSelection = (sel) => Sys.vom.Set(P.doc, 'selection', sel);

/* ============================================================================
 *  DRAWING ENGINE — layers, pan/zoom/rotate, overlay, history, copy/paste
 * ========================================================================== */
const $ = (s) => document.querySelector(s);
const layerCanvases = new Map();   // id -> HTMLCanvasElement (native interop, mounted on the layer VOM object)
const overlayCanvas = document.createElement('canvas'); overlayCanvas.id = 'overlay-canvas';
let view = { x: 0, y: 0, scale: 1, rotate: 0 };

const blendCss = (m) => ({ Normal: 'normal', Multiply: 'multiply', Screen: 'screen', Overlay: 'overlay', Dodge: 'color-dodge', Burn: 'color-burn' }[m] || 'normal');

function applyWorld() { $('#world').style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale}) rotate(${view.rotate}deg)`; }

function reconcileLayers() {
  const artboard = $('#artboard'); const W = doc('width'), H = doc('height'); const order = getOrder();
  artboard.style.display = order.length ? 'block' : 'none'; // no canvas until a document exists (1:1 with the reference)
  artboard.style.width = W + 'px'; artboard.style.height = H + 'px';
  for (const id of order) if (!layerCanvases.has(id)) { const c = document.createElement('canvas'); c.width = W; c.height = H; layerCanvases.set(id, c); }
  for (const id of [...layerCanvases.keys()]) if (!order.includes(id)) { layerCanvases.get(id).remove(); layerCanvases.delete(id); }
  const domOrder = [...order].reverse();
  for (const id of domOrder) { const c = layerCanvases.get(id); const l = getLayer(id); if (!l) continue; c.style.display = l.visible ? 'block' : 'none'; c.style.opacity = l.opacity / 100; c.style.mixBlendMode = blendCss(l.blendMode); artboard.appendChild(c); }
  overlayCanvas.width = W; overlayCanvas.height = H; artboard.appendChild(overlayCanvas);
}

const allCanvasRefs = () => getOrder().map((id) => ({ id, canvas: layerCanvases.get(id) })).filter((l) => l.canvas);

/* ---- History (ImageData snapshots, ported from HistoryManager) ---- */
const History = (() => {
  let undo = [], redo = [], max = 40;
  const sync = () => { setSession('canUndo', undo.length > 1); setSession('canRedo', redo.length > 0); };
  const grab = () => allCanvasRefs().filter((l) => l.canvas.width > 0).map((l) => ({ id: l.id, data: l.canvas.getContext('2d').getImageData(0, 0, l.canvas.width, l.canvas.height) }));
  const apply = (st) => st.forEach((s) => { const c = layerCanvases.get(s.id); if (c) c.getContext('2d').putImageData(s.data, 0, 0); });
  return {
    push() { const st = grab(); if (!st.length) return; undo.push(st); if (undo.length > max) undo.shift(); redo = []; sync(); },
    clear() { undo = []; redo = []; sync(); },
    undo() { if (undo.length <= 1) return; redo.push(grab()); apply(undo.pop()); sync(); },   // apply the POPPED (pre-edit) snapshot, like the TS HistoryManager — not the new top
    redo() { if (!redo.length) return; undo.push(grab()); apply(redo.pop()); sync(); },
  };
})();
const pushUndo = () => History.push();

/* ---- pointer → canvas coordinate transform ---- */
function canvasPoint(e) {
  let cx, cy, pressure = e.pressure != null ? e.pressure : 1;
  if (e.touches && e.touches[0]) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  else { cx = e.clientX; cy = e.clientY; }
  const rect = $('#viewport').getBoundingClientRect();
  const dxs = (cx - rect.left) - view.x, dys = (cy - rect.top) - view.y;
  const r = view.rotate * Math.PI / 180, s = view.scale;
  return { x: (dxs * Math.cos(r) + dys * Math.sin(r)) / s, y: (-dxs * Math.sin(r) + dys * Math.cos(r)) / s, pressure };
}

function toolCtx() {
  const id = session('activeLayerId') !== undefined ? doc('activeLayerId') : doc('activeLayerId');
  const aid = doc('activeLayerId'); const ldef = getLayer(aid); const canvas = layerCanvases.get(aid);
  if (!ldef || !canvas) return null;
  const t = Tools[session('tool')]; const sysSel = t && (t.type === 'select' || t.id === 'move');
  if (!sysSel && (ldef.locked || !ldef.visible)) return null;
  return {
    canvas, ctx: canvas.getContext('2d'), overlayCanvas, overlayCtx: overlayCanvas.getContext('2d'),
    transform: { ...view }, color: session('color'), size: session('brushSize'), opacity: session('opacity'),
    pushUndoState: pushUndo, commit() {},
  };
}

/* ---- pointer handling: draw / pan / pinch / wheel ---- */
const pointers = new Map();
let drawing = false, panning = false, spaceDown = false;
let dragStart = { ex: 0, ey: 0, tx: 0, ty: 0 };
let pinch = null;

function initEngine() {
  const vp = $('#viewport');
  recenter();

  vp.addEventListener('pointerdown', (e) => {
    const edge = 40;
    if (pointers.size === 0 && (e.clientX < edge || e.clientX > innerWidth - edge || e.clientY < edge || e.clientY > innerHeight - edge)) return;
    vp.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      const pt = canvasPoint(e); const inside = pt.x >= 0 && pt.x <= doc('width') && pt.y >= 0 && pt.y <= doc('height');
      const wantPan = session('tool') === 'hand' || e.button === 1 || e.button === 2 || spaceDown || !inside;   // Pan tool, right/middle click, or space = drag to pan
      if (wantPan) { panning = true; drawing = false; dragStart = { ex: e.clientX, ey: e.clientY, tx: view.x, ty: view.y }; }
      else { panning = false; drawing = true; const c = toolCtx(); const t = Tools[session('tool')]; if (c && t && t.onPointerDown) t.onPointerDown(pt, c); }
    } else if (pointers.size === 2) {
      drawing = false; panning = false; const p = [...pointers.values()];
      const dx = p[1].x - p[0].x, dy = p[1].y - p[0].y; const rect = vp.getBoundingClientRect();
      pinch = { dist: Math.hypot(dx, dy), scale: view.scale, pan: { x: view.x, y: view.y }, rotate: view.rotate, angle: Math.atan2(dy, dx),
        center: { x: (p[0].x + p[1].x) / 2 - rect.left, y: (p[0].y + p[1].y) / 2 - rect.top } };
    }
  });

  vp.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1 && panning) { view.x = dragStart.tx + (e.clientX - dragStart.ex); view.y = dragStart.ty + (e.clientY - dragStart.ey); applyWorld(); }
    else if (pointers.size === 1 && drawing) {
      const c = toolCtx(); const t = Tools[session('tool')];
      if (c && t && t.onPointerMove) {
        const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
        if (evs.length) { for (const ce of evs) t.onPointerMove(canvasPoint(ce), c); }
        else t.onPointerMove(canvasPoint(e), c);
      }
    }
    else if (pointers.size === 2 && pinch) {
      const p = [...pointers.values()]; const dx = p[1].x - p[0].x, dy = p[1].y - p[0].y; const dist = Math.hypot(dx, dy);
      const ns = Math.max(0.05, Math.min(10, pinch.scale * (dist / pinch.dist))); view.scale = ns;
      let da = Math.atan2(dy, dx) - pinch.angle; da = Math.atan2(Math.sin(da), Math.cos(da)); const rdeg = pinch.rotate + da * 180 / Math.PI; view.rotate = rdeg;
      const rect = vp.getBoundingClientRect(); const cc = { x: (p[0].x + p[1].x) / 2 - rect.left, y: (p[0].y + p[1].y) / 2 - rect.top };
      const r0 = pinch.rotate * Math.PI / 180, s0 = pinch.scale; const rx0 = (pinch.center.x - pinch.pan.x) / s0, ry0 = (pinch.center.y - pinch.pan.y) / s0;
      const cx = rx0 * Math.cos(r0) + ry0 * Math.sin(r0), cy = -rx0 * Math.sin(r0) + ry0 * Math.cos(r0); const rm = rdeg * Math.PI / 180;
      view.x = cc.x - ns * (cx * Math.cos(rm) - cy * Math.sin(rm)); view.y = cc.y - ns * (cx * Math.sin(rm) + cy * Math.cos(rm)); applyWorld();
    }
  });

  const up = (e) => {
    try { vp.releasePointerCapture(e.pointerId); } catch (err) {}
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      if (drawing) { const pt = canvasPoint(e); const c = toolCtx(); const t = Tools[session('tool')]; if (c && t && t.onPointerUp) t.onPointerUp(pt, c); }
      drawing = false; panning = false; pinch = null;
    } else if (pointers.size === 1) { drawing = false; panning = false; }
  };
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up); vp.addEventListener('pointerleave', up);
  vp.addEventListener('contextmenu', (e) => e.preventDefault());   // right-drag pans; no context menu

  vp.addEventListener('wheel', (e) => {
    e.preventDefault(); const rect = vp.getBoundingClientRect(); const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const cur = view.scale; let f = e.deltaY < 0 ? 1.1 : 1 / 1.1; if (e.ctrlKey) f = Math.exp(-e.deltaY * 0.01);
    const ns = Math.max(0.05, Math.min(10, cur * f)); view.x = mx - (mx - view.x) * (ns / cur); view.y = my - (my - view.y) * (ns / cur); view.scale = ns; applyWorld();
  }, { passive: false });

  addEventListener('keydown', (e) => {
    const a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
    if (e.code === 'Space') { e.preventDefault(); spaceDown = true; vp.style.cursor = 'grab'; }
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); History.undo(); }
    else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); History.redo(); }
    else if (mod && e.key.toLowerCase() === 'c') { e.preventDefault(); doCopy(); }
    else if (mod && e.key.toLowerCase() === 'v') { e.preventDefault(); doPaste(); }
    else if (mod && e.key.toLowerCase() === 'x') { e.preventDefault(); doCut(); }
  });
  addEventListener('keyup', (e) => { if (e.code === 'Space') { spaceDown = false; refreshCursor(); } });

  // keep cursor synced with active tool
  bind(P.session, refreshCursor);
}

function refreshCursor() { const t = Tools[session('tool')]; $('#viewport').style.cursor = spaceDown ? 'grab' : (t && t.cursor) || 'crosshair'; }

/* ---- copy / cut / paste ---- */
function doCopy() {
  const aid = doc('activeLayerId'); const cv = layerCanvases.get(aid); if (!cv) return; const sel = doc('selection');
  const out = document.createElement('canvas');
  if (!sel || !sel.bounds) { out.width = cv.width; out.height = cv.height; out.getContext('2d').drawImage(cv, 0, 0); window.__clip = { canvas: out, x: 0, y: 0 }; hud('Copied entire layer'); return; }
  const b = sel.bounds; if (b.w <= 0 || b.h <= 0) { hud('Selection too small'); return; }
  out.width = b.w; out.height = b.h; const oc = out.getContext('2d');
  if (sel.type === 'lasso' && sel.points) { oc.save(); oc.beginPath(); oc.moveTo(sel.points[0].x - b.x, sel.points[0].y - b.y); sel.points.forEach((p) => oc.lineTo(p.x - b.x, p.y - b.y)); oc.closePath(); oc.clip(); oc.drawImage(cv, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h); oc.restore(); }
  else oc.drawImage(cv, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);
  window.__clip = { canvas: out, x: b.x, y: b.y }; hud('Copied selection');
}
function doCut() { const aid = doc('activeLayerId'); const cv = layerCanvases.get(aid); if (!cv) return; doCopy(); pushUndo(); const g = cv.getContext('2d'); const sel = doc('selection');
  if (!sel || !sel.bounds) g.clearRect(0, 0, cv.width, cv.height); else g.clearRect(sel.bounds.x, sel.bounds.y, sel.bounds.w, sel.bounds.h); hud('Cut'); }
function doPaste() {
  const clip = window.__clip; if (!clip) { hud('Clipboard empty'); return; } pushUndo();
  const id = Date.now(); const order = getOrder(); const aidx = order.indexOf(doc('activeLayerId'));
  Sys.vom.Register(layerPath(id), 'Layer', { id, name: 'Pasted Pixels', visible: true, locked: false, alphaLocked: false, blendMode: 'Normal', opacity: 100 });
  const next = [...order]; next.splice(Math.max(0, aidx), 0, id); setOrder(next); Sys.vom.Set(P.doc, 'activeLayerId', id);
  reconcileLayers(); const c = layerCanvases.get(id); c.getContext('2d').drawImage(clip.canvas, clip.x, clip.y); hud('Pasted into new layer');
}

function attachLayerGestures(row) {
  const id = +row.dataset.layer; let mode = 'none', sx = 0, sy = 0, startOp = 100;
  row.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return; Sys.vom.Set(P.doc, 'activeLayerId', id);
    mode = 'none'; sx = e.clientX; sy = e.clientY; startOp = getLayer(id).opacity; row.setPointerCapture(e.pointerId);
  });
  row.addEventListener('pointermove', (e) => {
    if (!row.hasPointerCapture(e.pointerId)) return; const dx = e.clientX - sx, dy = e.clientY - sy;
    if (mode === 'none') { if (Math.abs(dx) > 5 && Math.abs(dx) > Math.abs(dy)) { mode = 'opacity'; } else if (Math.abs(dy) > 6) { mode = 'reorder'; row.classList.add('reorder'); } }
    if (mode === 'opacity') { setLayer(id, { opacity: Math.max(0, Math.min(100, Math.round(startOp + dx / 1.5))) }); reconcileLayers(); }
    else if (mode === 'reorder') {
      const rows = [...$('#layer-list').children]; let ti = -1; for (let i = 0; i < rows.length; i++) { const r = rows[i].getBoundingClientRect(); if (e.clientY >= r.top && e.clientY <= r.bottom) { ti = i; break; } }
      const order = getOrder(); const ci = order.indexOf(id); if (ti >= 0 && ci >= 0 && ci !== ti) { const next = [...order]; next.splice(ci, 1); next.splice(ti, 0, id); setOrder(next); reconcileLayers(); }
    }
  });
  const end = (e) => { try { row.releasePointerCapture(e.pointerId); } catch (x) {} row.classList.remove('reorder'); mode = 'none'; };
  row.addEventListener('pointerup', end); row.addEventListener('pointercancel', end);
}

let fxBackup = null, fxActive = null, fxVals = {};

function buildBottom() {

      <div><h3 class="section" style="color:var(--indigo-2);margin-bottom:8px">Filters</h3><div style="display:flex;flex-direction:column;gap:4px" id="fx-filter"></div></div>

  const mk = (f) => `<button class="row" data-fx="${f.id}" style="width:100%;gap:10px;padding:10px;background:rgba(255,255,255,0.05);border-radius:10px;text-align:left;color:rgba(255,255,255,0.8)">${icon(f.icon)}<span style="font-size:12px;font-weight:500">${f.title}</span></button>`;
  $('#fx-adjust').innerHTML = FILTERS.adjust.map(mk).join('');

function openFx(fid) {
  const def = [...FILTERS.adjust, ...FILTERS.filter].find((f) => f.id === fid); fxActive = def; fxVals = {};
  def.params.forEach((pr) => fxVals[pr[0]] = pr[4]);
  const aid = doc('activeLayerId'); const cv = layerCanvases.get(aid); if (cv) fxBackup = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height);
  const panel = $('#fx-panel'); $('#fx-menu').style.display = 'none'; panel.style.display = 'flex';
  panel.innerHTML = `
    <div class="row" style="gap:12px;margin:6px 0 18px"><button id="fx-back" class="iconbtn">${icon('chevleft')}</button><h2 class="title mono">${def.title}</h2></div>
    <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:0 4px">
      ${def.params.map((pr) => `<div><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="muted">${pr[1]}</span><span class="mono" style="color:var(--indigo-2)" id="fxv-${pr[0]}"></span></div><input type="range" min="${pr[2]}" max="${pr[3]}" value="${pr[4]}" data-fx-param="${pr[0]}" style="width:100%"></div>`).join('')}
    </div>
    <div class="row" style="gap:12px;padding-top:14px;border-top:1px solid var(--line)"><button class="btn-soft" id="fx-cancel">Cancel</button><button class="btn-primary" id="fx-apply">Apply</button></div>`;
  panel.querySelectorAll('[data-fx-param]').forEach((r) => r.oninput = () => { fxVals[r.dataset.fxParam] = +r.value; runFx(); });
  $('#fx-back').onclick = $('#fx-cancel').onclick = cancelFx;
  $('#fx-apply').onclick = applyFx;
  paintIcons(panel);

}
function fxLabel() { fxActive.params.forEach((pr) => { const e = $('#fxv-' + pr[0]); if (!e) return; let v = fxVals[pr[0]]; if (pr[0] === 'gamma') v = (v / 100).toFixed(2); e.textContent = v + pr[5]; }); }
function runFx() {
  if (!fxBackup || !fxActive) return; const aid = doc('activeLayerId'); const cv = layerCanvases.get(aid); if (!cv) return; const g = cv.getContext('2d');
  cv.style.filter = 'none'; fxLabel(); const id = fxActive.id, v = fxVals;
  if (id === 'bc') { cv.style.filter = `brightness(${v.brightness}%) contrast(${v.contrast}%)`; return; }
  if (id === 'hs') { cv.style.filter = `hue-rotate(${v.hue}deg) saturate(${v.saturation}%)`; return; }
  if (id === 'gb') { cv.style.filter = `blur(${v.blur}px)`; return; }
  const src = fxBackup, W = src.width, H = src.height; const out = g.createImageData(W, H); const s = src.data, d = out.data;
  if (id === 'cb') { const ro = v.cr * 2.55, go = v.mg * 2.55, bo = v.yb * 2.55; for (let i = 0; i < s.length; i += 4) { d[i] = clamp(s[i] + ro); d[i + 1] = clamp(s[i + 1] + go); d[i + 2] = clamp(s[i + 2] + bo); d[i + 3] = s[i + 3]; } }
  else if (id === 'lv') { const range = (v.max - v.min) || 1, ig = 1 / (v.gamma / 100); for (let i = 0; i < s.length; i += 4) { for (let k = 0; k < 3; k++) { const n = (s[i + k] - v.min) / range; d[i + k] = clamp(Math.pow(Math.max(0, Math.min(1, n)), ig) * 255); } d[i + 3] = s[i + 3]; } }
  else if (id === 'mb') { if (v.mlen <= 0) { g.putImageData(src, 0, 0); return; } const ar = v.mang * Math.PI / 180, dx = Math.cos(ar), dy = Math.sin(ar); for (let cy = 0; cy < H; cy++) for (let cx = 0; cx < W; cx++) { const idx = (cy * W + cx) * 4; let r = 0, gg = 0, b = 0, a = 0, n = 0; for (let st = -2; st <= 2; st++) { const ox = Math.round((st / 2) * v.mlen * dx), oy = Math.round((st / 2) * v.mlen * dy); const sx = Math.max(0, Math.min(W - 1, cx + ox)), sy = Math.max(0, Math.min(H - 1, cy + oy)); const si = (sy * W + sx) * 4; r += s[si]; gg += s[si + 1]; b += s[si + 2]; a += s[si + 3]; n++; } d[idx] = r / n; d[idx + 1] = gg / n; d[idx + 2] = b / n; d[idx + 3] = a / n; } }
  else if (id === 'lq') { const cxp = W / 2, cyp = H / 2, str = v.lstr / 100; for (let cy = 0; cy < H; cy++) { const dy = cy - cyp; for (let cx = 0; cx < W; cx++) { const dx = cx - cxp, dist = Math.hypot(dx, dy), idx = (cy * W + cx) * 4; if (dist < v.lrad) { const ratio = dist / v.lrad; const f = str > 0 ? Math.pow(ratio, 1 - str * 0.45) : Math.pow(ratio, 1 / (1 + str * 0.45)); const sx = Math.max(0, Math.min(W - 1, Math.round(cxp + dx * f))), sy = Math.max(0, Math.min(H - 1, Math.round(cyp + dy * f))); const si = (sy * W + sx) * 4; d[idx] = s[si]; d[idx + 1] = s[si + 1]; d[idx + 2] = s[si + 2]; d[idx + 3] = s[si + 3]; } else { d[idx] = s[idx]; d[idx + 1] = s[idx + 1]; d[idx + 2] = s[idx + 2]; d[idx + 3] = s[idx + 3]; } } } }
  else if (id === 'nz') { const sc = v.noise * 2.55; for (let i = 0; i < s.length; i += 4) { const n = (Math.random() - 0.5) * sc; d[i] = clamp(s[i] + n); d[i + 1] = clamp(s[i + 1] + n); d[i + 2] = clamp(s[i + 2] + n); d[i + 3] = s[i + 3]; } }
  g.putImageData(out, 0, 0);
}
const clamp = (v) => Math.max(0, Math.min(255, v));
function applyFx() {
  const aid = doc('activeLayerId'); const cv = layerCanvases.get(aid); if (cv) {
    pushUndo(); const g = cv.getContext('2d');
    if (['bc', 'hs', 'gb'].includes(fxActive.id)) { const t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height; t.getContext('2d').drawImage(cv, 0, 0); g.clearRect(0, 0, cv.width, cv.height); g.filter = cv.style.filter; g.drawImage(t, 0, 0); g.filter = 'none'; }
    cv.style.filter = 'none';
  }

}
function cancelFx() {
  if (fxBackup) { const cv = layerCanvases.get(doc('activeLayerId')); if (cv) { cv.getContext('2d').putImageData(fxBackup, 0, 0); cv.style.filter = 'none'; } }
  fxBackup = null; fxActive = null; closeFx();
}
function closeFx() { $('#fx-panel').style.display = 'none'; $('#fx-menu').style.display = 'flex'; }

/* ============================================================================
 *  THUMBSTICK
 * ========================================================================== */
function initStick() {

  let pos = { x: innerWidth - 150, y: innerHeight - 170 }, nestled = null;
  const place = () => { stick.style.left = pos.x + 'px'; stick.style.top = pos.y + 'px'; };
  const clampY = () => { pos.y = Math.max(8, Math.min(innerHeight - SZ - 8, pos.y)); };
  // dock to an edge: ring goes transparent (only the nub peeks), base stops blocking the canvas
  const nestle = (side) => { nestled = side; stick.classList.add('nestled'); stick.style.pointerEvents = 'none'; nub.style.pointerEvents = 'auto'; pos.x = side === 'left' ? -65 : innerWidth - 65; clampY(); place(); };
  const wake = () => { if (!nestled) return; const side = nestled; nestled = null; stick.classList.remove('nestled'); stick.style.pointerEvents = ''; nub.style.pointerEvents = ''; pos.x = side === 'left' ? 16 : innerWidth - SZ - 16; clampY(); place(); };
  clampY(); place();

  stick.addEventListener('pointerdown', (e) => {
    wake();
    stick.setPointerCapture(e.pointerId); sx = e.clientX; sy = e.clientY; lastX = e.clientX; lastY = e.clientY; off = { x: 0, y: 0 }; moved = false;
    const r = stick.getBoundingClientRect(); const d = Math.hypot(e.clientX - (r.left + SZ / 2), e.clientY - (r.top + SZ / 2));
    mode = d < 32 ? 'flick' : 'move';
  });
  nub.addEventListener('pointerdown', () => { if (nestled) wake(); });   // tap a docked stick to pop it back out
  stick.addEventListener('pointermove', (e) => {
    if (mode === 'idle') return;
    if (mode === 'move') {
      pos.x += e.clientX - lastX; pos.y += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; moved = true;
      clampY(); pos.x = Math.max(-SZ + 30, Math.min(innerWidth - 30, pos.x)); place();   // always keep ≥30px on-screen so it never vanishes
    } else { let nx = e.clientX - sx, ny = e.clientY - sy; const d = Math.hypot(nx, ny); const M = 40; if (d > M) { nx = nx / d * M; ny = ny / d * M; } off = { x: nx, y: ny }; if (d > 4) moved = true; nub.style.transform = `translate(${nx}px,${ny}px)`; }
  });

    try { stick.releasePointerCapture(e.pointerId); } catch (x) {}

      if (ax > 20 || ay > 20) { if (ax > ay) { if (off.x < 0) setView(cv === 'right' ? 'center' : 'left'); else setView(cv === 'left' ? 'center' : 'right'); } else { if (off.y < 0) setView(cv === 'bottom' ? 'center' : 'top'); else setView(cv === 'top' ? 'center' : 'bottom'); } }
      else setView('center');

}

 *  SHELL — view switching, swipe gestures, dismiss, grip tabs
 * ========================================================================== */

  $('#dismiss').addEventListener('pointerdown', () => setView('center'));
  document.querySelectorAll('.tab[data-toggle]').forEach((t) => t.onclick = () => { const v = t.dataset.toggle; setView(document.body.dataset.view === v ? 'center' : v); });

  addEventListener('pointerdown', (e) => { if (!e.isPrimary) { active = false; return; } if (e.target.closest('[data-thumbstick]') || e.target.closest('.panel') || e.target.closest('#top')) { active = false; return; } startX = e.clientX; startY = e.clientY; t0 = Date.now(); active = true; });

    const cv = document.body.dataset.view, ET = 40;

    }

}

/* ---- AI background erase: matte the active layer in place (on-device, undoable) ---- */

  // cheap emptiness check on a tiny downscaled probe (avoid a full-res getImageData on phones)
  const pw = Math.max(1, Math.min(64, cv.width)), ph = Math.max(1, Math.min(64, cv.height));
  const pc = document.createElement('canvas'); pc.width = pw; pc.height = ph;

  const probe = pc.getContext('2d').getImageData(0, 0, pw, ph).data;

function loadProject(proj) {

  (proj.layers || []).forEach((l) => Sys.vom.Register(layerPath(l.id), 'Layer', { id: l.id, name: l.name, visible: l.visible, locked: l.locked, alphaLocked: l.alphaLocked, blendMode: l.blendMode, opacity: l.opacity }));

  for (const { id } of backups) { const cv = layerCanvases.get(id); cv.width = nw; cv.height = nh; }
  reconcileLayers();
  backups.forEach(({ id, b }) => { const cv = layerCanvases.get(id); cv.getContext('2d').drawImage(b, (nw - b.width) / 2, (nh - b.height) / 2); });
  History.push(); recenter(); setView('center');
}

/* ============================================================================
 *  BOOT
 * ========================================================================== */
function persistSession() {
  if (Sys.mode !== 'standalone') return;
  try {
    const keep = {}; ['tool', 'color', 'brushSize', 'opacity', 'tolerance', 'thumbstickEnabled'].forEach((k) => keep[k] = session(k));
    localStorage.setItem('flickpaint.session', JSON.stringify(keep));
  } catch (e) {}
}

function boot() {
  // Session settings (truth in VOM \Session). Restore persisted standalone settings.
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('flickpaint.session') || '{}'); } catch (e) {}
  Sys.vom.Register(P.session, 'Session', {
    tool: saved.tool || 'brush', color: saved.color || '#111827',
    brushSize: saved.brushSize || 18, opacity: saved.opacity || 100,
    tolerance: saved.tolerance ?? 42,
    view: 'center', thumbstickEnabled: saved.thumbstickEnabled !== false,
    canUndo: false, canRedo: false,
  });

  // Document (truth in VOM \Document) — boot EMPTY, like the reference: just the dark pasteboard,
  // no artboard/checkerboard until the user picks New or Open.
  Sys.vom.Register(P.doc, 'Document', { width: 1080, height: 1080, activeLayerId: null, selection: null });
  Sys.vom.Register(P.layers, 'Layers', { order: [] });

  reconcileLayers();
  bind(P.layers, reconcileLayers);
  bind(P.doc, () => { const W = doc('width'), H = doc('height'); $('#artboard').style.width = W + 'px'; $('#artboard').style.height = H + 'px'; });

  buildLeft(); buildRight(); buildTop(); buildBottom(); buildAssets();
  initEngine(); initShell(); initStick();
  paintIcons();

  History.clear(); pushUndo();
  refreshCursor(); updateStickLabels();

  $('#mode').textContent = `Sys: ${Sys.mode} · truth in registry+vom`;
  Sys.vom.Wait('*', persistSession);

  // expose for verification / host bridging (a handle, not state — same role as the host provider hook)
  window.Sys = Sys;
  window.__fp = {
    Sys, P, Tools, layerCanvases, History,
    get view() { return view; }, setView, refreshCursor,
    doc, session, setSession, getOrder, getLayer, getLayers, setSelection,
    toolCtx, reconcileLayers, applyWorld, recenter,
    doCopy, doCut, doPaste, exportPNG, saveProject, loadProject, newProject, applyResize, importFile, hud,
  };
  console.log('[FlickPaint] booted — provider mode:', Sys.mode);
}

boot();
</script>
