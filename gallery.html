<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gallery · art4quinn</title>
<style>
  :root{ --bg:#0d0d12; --text:#f3f3f8; --dim:#a6a6b4; --border:#2c2c38; --pink:#ff5edb; --blue:#3bc9ff; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    background:radial-gradient(130% 80% at 50% 0%, #1d1d30 0%, #0d0d12 55%, #08080c 100%);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; padding:0 14px 48px;
  }
  header{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px;
    padding:14px 4px; background:linear-gradient(#0d0d12 70%, rgba(13,13,18,0));
  }
  a.back{ text-decoration:none; color:var(--text); font-weight:700; font-size:.92rem;
    border:1px solid var(--border); border-radius:11px; padding:8px 12px; background:#16161f; }
  a.back:active{transform:scale(.96);}
  h1{ margin:0; font-size:1.5rem; font-weight:900;
    background:linear-gradient(92deg, var(--pink), var(--blue));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  #grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; max-width:1100px; margin:0 auto;
  }
  .tile{
    position:relative; aspect-ratio:1; border-radius:14px; overflow:hidden;
    background:#16161f; border:1px solid var(--border);
  }
  .tile img, .tile video{width:100%; height:100%; object-fit:cover; display:block;}
  .tile .badge{
    position:absolute; top:8px; left:8px; font-size:.66rem; font-weight:800; letter-spacing:.5px;
    background:rgba(0,0,0,.62); color:#fff; padding:3px 7px; border-radius:8px;
  }
  .tile .play{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:2.4rem; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.7); pointer-events:none;
  }
  .tile .cut{
    position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:9px;
    border:1px solid rgba(255,255,255,.18); background:rgba(13,13,18,.62); color:#fff;
    font-size:.95rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:transform .12s, background .15s;
  }
  .tile .cut:hover{ background:rgba(59,201,255,.32); }
  .tile .cut:active{ transform:scale(.9); }
  #count{color:var(--dim); font-size:.8rem; margin:0 auto 14px; max-width:1100px;}
  #err{color:#ff8a8a; font-size:.85rem; max-width:1100px; margin:10px auto;}

  /* ---- Theme: follow the OS (automatic light/dark) ---- */
  :root{ color-scheme:dark; }
  @media (prefers-color-scheme: light){
    :root{ color-scheme:light; --bg:#eef1f7; --text:#15151c; --dim:#5d6270; --border:#d3d7e0; }
    body{ background: radial-gradient(130% 80% at 50% 0%, #ffffff 0%, #eef1f7 55%, #e6eaf2 100%); }
    header{ background: linear-gradient(#eef1f7 70%, rgba(238,241,247,0)); }
    a.back{ background:#fff; }
    .tile{ background:#f4f6fb; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="./">← Home</a>
  <h1>Quinn's Gallery</h1>
</header>

<div id="count"></div>
<div id="err"></div>
<div id="grid"></div>

<script>
const grid = document.getElementById('grid');
const isVid = f => /\.(mp4|webm|mov)$/i.test(f);

function tileFor(file){
  const t = document.createElement('div'); t.className = 'tile';
  if (isVid(file)){
    t.innerHTML = '<div class="badge">▶ VIDEO</div><div class="play">▶</div>';
    t.addEventListener('click', () => {
      if (t.querySelector('video')) return;
      t.innerHTML = '';
      const v = document.createElement('video');
      v.src = 'gallery/' + file; v.controls = true; v.autoplay = true; v.playsInline = true; v.loop = true;
      t.appendChild(v);
    }, { once:true });
  } else {
    const img = document.createElement('img');
    img.loading = 'lazy'; img.decoding = 'async'; img.alt = file; img.src = 'gallery/' + file;
    t.appendChild(img);

    // ✂︎ on-device background erase -> download a transparent PNG
    const cut = document.createElement('button');
    cut.className = 'cut'; cut.title = 'Erase background (AI)'; cut.textContent = '✂︎';
    cut.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (cut.dataset.busy) return;
      cut.dataset.busy = '1'; const orig = cut.textContent; cut.textContent = '…';
      try {
        const { removeBackground } = await import('./assets/ml/segment.js');
        const canvas = await removeBackground('gallery/' + file, (s) => { cut.title = s; });
        const a = document.createElement('a');
        a.download = file.replace(/\.[^.]+$/, '') + '-nobg.png';
        a.href = canvas.toDataURL('image/png'); a.click();
        cut.textContent = '✓';
      } catch (err) {
        console.error(err); cut.textContent = '⚠'; cut.title = 'AI erase failed — ' + (err.message || err);
      } finally {
        setTimeout(() => { cut.textContent = '✂︎'; cut.title = 'Erase background (AI)'; }, 1600);
        cut.dataset.busy = '';
      }
    });
    t.appendChild(cut);
  }
  return t;
}

fetch('gallery/manifest.json')
  .then(r => { if(!r.ok) throw new Error('manifest ' + r.status); return r.json(); })
  .then(list => {
    list.sort();
    document.getElementById('count').textContent = list.length + ' pieces';
    const frag = document.createDocumentFragment();
    list.forEach(f => frag.appendChild(tileFor(f)));
    grid.appendChild(frag);
  })
  .catch(e => {
    document.getElementById('err').textContent =
      'Could not load the gallery list (' + e.message + '). Serve over http, not file://.';
  });
</script>
</body>
</html>
