<!DOCTYPE html>
<html>
<head>
<title>Video Node</title>
<style>
  body { background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
  h1 { font-size: 20px; }
  .box { width: 90%; max-width: 600px; aspect-ratio: 16/9; border: 2px dashed #444; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #888; }
</style>
</head>
<body>
  <h1>Video Node Manager</h1>
  <div class="box">No Video Source Connected</div>
  <br/>
  <button onclick="window.parent.postMessage('close-applet', '*')" style="padding: 10px 20px;">Close Node</button>
</body>
</html>
