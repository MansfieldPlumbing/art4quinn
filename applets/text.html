<!DOCTYPE html>
<html>
<head>
<title>Text Viewer</title>
<style>
  body { font-family: monospace; background: #fff; padding: 20px; }

  <h2>Text Viewer <button onclick="window.parent.postMessage('close-applet', '*')">X</button></h2>
